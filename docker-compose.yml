version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - db
    networks:
      - clinic-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - clinic-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clinic_wa}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habibfr}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - clinic-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - db
    networks:
      - clinic-network

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - db
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge

volumes:
  db-data:
